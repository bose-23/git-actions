name: Deployment Request Handler

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  process-request:
    runs-on: ubuntu-latest

    steps:
      - name: Add Pending L1 Label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["pending-l1"]
            });

      - name: Remove New Request Label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: "new-request"
              });
            } catch (error) {
              console.log("new-request label not found");
            }

      - name: Create Deployment Summary
        uses: actions/github-script@v7
        with:
          script: |

            const issueNumber = context.issue.number;

            const issueBody = context.payload.issue.body || "";

            function extractApprover(fieldName) {
              const regex = new RegExp(fieldName + "\\s*\\n([^\\n]+)", "i");
              const match = issueBody.match(regex);

              if (!match) {
                return "";
              }

              return match[1].trim().replace("@", "");
            }

            const l1Approver = extractApprover("L1 Approver");

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            const latestCommit = commits.data[0];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body:
                "DEPLOYMENT REQUEST SUMMARY" +
                "\n\nRequest Information" +
                "\n-------------------" +
                "\nRequest ID: #" + issueNumber +
                "\nRequested By: @" + context.payload.issue.user.login +
                "\nRepository: " + context.repo.repo +
                "\nRepository Owner: " + context.repo.owner +

                "\n\nTechnical Information" +
                "\n---------------------" +
                "\nBranch: " + context.payload.repository.default_branch +
                "\nWorkflow Run Number: " + process.env.GITHUB_RUN_NUMBER +
                "\nLatest Commit SHA: " + latestCommit.sha +
                "\nCommit Author: " + latestCommit.commit.author.name +
                "\nCommit Message: " + latestCommit.commit.message +

                "\n\nApproval Status" +
                "\n---------------" +
                "\nL1: Pending" +
                "\nL2: Pending" +
                "\nL3: Pending" +

                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nPending L1 Approval" +

                "\n\nAction Required" +
                "\n---------------" +
                "\n@" + l1Approver +
                "\n\nPlease review this deployment request." +
                "\n\nUse:" +
                "\n/approve-l1"
            });
