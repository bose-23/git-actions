name: Deployment Request Handler

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  process-request:
    runs-on: ubuntu-latest

    steps:
      - name: Add Pending L1 Label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: ["pending-l1"]
            });

      - name: Remove New Request Label
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                name: "new-request"
              });
            } catch (error) {
              console.log("new-request label not found");
            }

      - name: Create Deployment Summary
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;

            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });

            const latestCommit = commits.data[0];

            const summary = `
            🚀 DEPLOYMENT REQUEST SUMMARY

            Request Information
            ===================

            Request ID: #${issueNumber}
            Requested By: @${context.payload.issue.user.login}
            Repository: ${context.repo.repo}
            Repository Owner: ${context.repo.owner}

            Technical Information
            =====================

            Branch: ${context.payload.repository.default_branch}
            Workflow Run Number: ${process.env.GITHUB_RUN_NUMBER}
            Latest Commit SHA: ${latestCommit.sha}
            Commit Author: ${latestCommit.commit.author.name}
            Commit Message: ${latestCommit.commit.message}

            Approval Matrix
            ===============

            L1: Pending
            L2: Pending
            L3: Pending

            Deployment Status
            =================

            Awaiting L1 Approval

            Audit Information
            =================

            Issue URL: ${context.payload.issue.html_url}
            Created At: ${context.payload.issue.created_at}

            Deployment request successfully registered and entered into the approval workflow.
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: summary
            });
