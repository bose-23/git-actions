name: Approval Handler

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write

jobs:
  process-approval:
    runs-on: ubuntu-latest

    steps:
      - name: Process Approval Commands
        uses: actions/github-script@v7
        with:
          script: |

            const issueNumber = context.issue.number;
            const comment = context.payload.comment.body.trim();
            const commenter = context.payload.comment.user.login;

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.data.body || "";

            function extractApprover(fieldName) {
              const regex = new RegExp(fieldName + "\\s*\\n([^\\n]+)", "i");
              const match = body.match(regex);

              if (!match) {
                return "";
              }

              return match[1].trim().replace("@", "");
            }

            const l1Approver = extractApprover("L1 Approver");
            const l2Approver = extractApprover("L2 Approver");
            const l3Approver = extractApprover("L3 Approver");

            const labelsResponse = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = labelsResponse.data.map(label => label.name);

            async function addComment(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message
              });
            }

            // ======================
            // L1 APPROVAL
            // ======================

            if (comment === "/approve-l1") {

              if (commenter !== l1Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l1Approver +
                  " can approve L1."
                );
                return;
              }

              if (!labels.includes("pending-l1")) {
                await addComment(
                  "This request is not awaiting L1 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l1"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l1",
                  "pending-l2"
                ]
              });

              await addComment(
                "L1 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Pending" +
                "\nL3: Pending" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nPending L2 Approval" +
                "\n\nAction Required" +
                "\n---------------" +
                "\n@" + l2Approver +
                "\n\nUse:" +
                "\n/approve-l2"
              );

              return;
            }

            // ======================
            // L2 APPROVAL
            // ======================

            if (comment === "/approve-l2") {

              if (commenter !== l2Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l2Approver +
                  " can approve L2."
                );
                return;
              }

              if (!labels.includes("pending-l2")) {
                await addComment(
                  "This request is not awaiting L2 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l2"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l2",
                  "pending-l3"
                ]
              });

              await addComment(
                "L2 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Approved" +
                "\nL3: Pending" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nPending L3 Approval" +
                "\n\nAction Required" +
                "\n---------------" +
                "\n@" + l3Approver +
                "\n\nUse:" +
                "\n/approve-l3"
              );

              return;
            }

            // ======================
            // L3 APPROVAL
            // ======================

            if (comment === "/approve-l3") {

              if (commenter !== l3Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l3Approver +
                  " can approve L3."
                );
                return;
              }

              if (!labels.includes("pending-l3")) {
                await addComment(
                  "This request is not awaiting L3 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l3"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l3",
                  "deployment-running"
                ]
              });

              const releaseTag = "deployment-request-" + issueNumber;

              try {

                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: releaseTag,
                  name: "Deployment Request #" + issueNumber,
                  body:
                    "Deployment Approval Completed\n\n" +
                    "Issue Number: #" + issueNumber +
                    "\nApproved By: @" + commenter +
                    "\nRepository: " + context.repo.repo +
                    "\n\nApproval Chain" +
                    "\nL1 Approved" +
                    "\nL2 Approved" +
                    "\nL3 Approved"
                });

              } catch (error) {
                console.log(error);
              }

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: ["released"]
                });
              } catch (error) {}

              await addComment(
                "L3 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Approved" +
                "\nL3: Approved" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nReleased" +
                "\n\nRelease Created" +
                "\n---------------" +
                "\nTag: " + releaseTag
              );

              return;
            }

            // ======================
            // REJECTION FLOW
            // ======================

            if (
              comment === "/reject-l1" ||
              comment === "/reject-l2" ||
              comment === "/reject-l3"
            ) {

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["rejected"]
              });

              await addComment(
                "Request Rejected\n\nRejected By: @" +
                commenter
              );

              return;
            }
