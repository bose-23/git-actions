name: Approval Handler

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write

jobs:
  process-approval:
    runs-on: ubuntu-latest

    steps:
      - name: Process Approval Commands
        uses: actions/github-script@v7
        with:
          script: |

            const issueNumber = context.issue.number;
            const comment = context.payload.comment.body.trim();
            const commenter = context.payload.comment.user.login;

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.data.body || "";

            function extractApprover(fieldName) {
              const regex = new RegExp(
                fieldName + "\\s*\\n([^\\n]+)",
                "i"
              );

              const match = body.match(regex);

              if (!match) {
                return "";
              }

              return match[1].trim().replace("@", "");
            }

            function extractField(fieldName) {

              const regex = new RegExp(
                fieldName + "\\s*\\n([^\\n]+)",
                "i"
              );

              const match = body.match(regex);

              if (!match) {
                return "Not Provided";
              }

              return match[1].trim();
            }

            const l1Approver = extractApprover("L1 Approver");
            const l2Approver = extractApprover("L2 Approver");
            const l3Approver = extractApprover("L3 Approver");

            const serviceName = extractField("Service Name");
            const environment = extractField("Target Environment");
            const riskLevel = extractField("Risk Level");
            const deploymentWindow = extractField("Deployment Window");
            const changeDescription = extractField("Change Description");
            const businessJustification = extractField("Business Justification");
            const testingDetails = extractField("Testing Details");
            const impactedComponents = extractField("Impacted Components");
            const rollbackPlan = extractField("Rollback Plan");
            const implementationSteps = extractField("Implementation Steps");
            const validationSteps = extractField("Post Deployment Validation");

            const labelsResponse = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = labelsResponse.data.map(
              label => label.name
            );

            async function addComment(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message
              });
            }

            // ======================
            // L1 APPROVAL
            // ======================

            if (comment === "/approve-l1") {

              if (commenter !== l1Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l1Approver +
                  " can approve L1."
                );
                return;
              }

              if (!labels.includes("pending-l1")) {
                await addComment(
                  "This request is not awaiting L1 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l1"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l1",
                  "pending-l2"
                ]
              });

              await addComment(
                "L1 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Pending" +
                "\nL3: Pending" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nPending L2 Approval" +
                "\n\nAction Required" +
                "\n---------------" +
                "\n@" + l2Approver +
                "\n\nUse:\n/approve-l2"
              );

              return;
            }

            // ======================
            // L2 APPROVAL
            // ======================

            if (comment === "/approve-l2") {

              if (commenter !== l2Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l2Approver +
                  " can approve L2."
                );
                return;
              }

              if (!labels.includes("pending-l2")) {
                await addComment(
                  "This request is not awaiting L2 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l2"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l2",
                  "pending-l3"
                ]
              });

              await addComment(
                "L2 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Approved" +
                "\nL3: Pending" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nPending L3 Approval" +
                "\n\nAction Required" +
                "\n---------------" +
                "\n@" + l3Approver +
                "\n\nUse:\n/approve-l3"
              );

              return;
            }

            // ======================
            // L3 APPROVAL
            // ======================

            if (comment === "/approve-l3") {

              if (commenter !== l3Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  l3Approver +
                  " can approve L3."
                );
                return;
              }

              if (!labels.includes("pending-l3")) {
                await addComment(
                  "This request is not awaiting L3 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-l3"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-l3",
                  "deployment-running"
                ]
              });

              const releaseTag =
                "deployment-request-" + issueNumber;

              try {

               const repoInfo = await github.rest.repos.get({
                 owner: context.repo.owner,
                 repo: context.repo.repo
               });

               const commits = await github.rest.repos.listCommits({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 per_page: 5
               });

               const latestCommit = commits.data[0];

               const recentCommits = commits.data
                 .map(commit =>
                   "- " +
                   commit.sha.substring(0, 7) +
                   " | " +
                   commit.commit.author.name +
                   " | " +
                   commit.commit.message
                  )
                 .join("\n");

               const changedFiles = await github.rest.repos.getCommit({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 ref: latestCommit.sha
                });

               const fileList = changedFiles.data.files
                 ?.map(file => "- " + file.filename)
                 .join("\n") || "Not Available";

                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,

                  tag_name: releaseTag,

                  name:
                    "Deployment Request #" +
                    issueNumber,

                  body:
                    "# DEPLOYMENT RECORD\n\n" +

                   "## Request Information\n\n" +

                   "- Issue Number: #" + issueNumber +
                   "\n- Service Name: " + serviceName +
                   "\n- Environment: " + environment +
                   "\n- Risk Level: " + riskLevel +
                   "\n- Deployment Window: " + deploymentWindow +

                   "\n\n## Change Description\n\n" +
                   changeDescription +

                   "\n\n## Business Justification\n\n" +
                   businessJustification +

                   "\n\n## Testing Details\n\n" +
                   testingDetails +

                   "\n\n## Impacted Components\n\n" +
                   impactedComponents +

                   "\n\n## Rollback Plan\n\n" +
                   rollbackPlan +

                   "\n\n## Implementation Steps\n\n" +
                   implementationSteps +

                   "\n\n## Post Deployment Validation\n\n" +
                   validationSteps +

                   "\n\n## Approval Information\n\n" +
                   "- L1 Approver: " + l1Approver +
                   "\n- L2 Approver: " + l2Approver +
                   "\n- L3 Approver: " + l3Approver +
                   "\n- Approved By: @" + commenter +

                   "\n\n## Repository Information\n\n" +
                   "- Repository: " + context.repo.repo +
                   "\n- Owner: " + context.repo.owner +
                   "\n- Branch: " + repoInfo.data.default_branch +
                   "\n- Repository URL: " + repoInfo.data.html_url +

                   "\n\n## Latest Commit\n\n" +
                   "- SHA: " + latestCommit.sha +
                   "\n- Author: " + latestCommit.commit.author.name +
                   "\n- Date: " + latestCommit.commit.author.date +
                   "\n- Message: " + latestCommit.commit.message +

                   "\n\n## Files Changed In Latest Commit\n\n" +
                   fileList +

                   "\n\n## Recent Commit History\n\n" +
                   recentCommits +

                   "\n\n## Workflow Information\n\n" +
                   "- Run Number: " + process.env.GITHUB_RUN_NUMBER +
                   "\n- Actor: " + commenter +

                   "\n\n## Audit Information\n\n" +
                   "- Issue URL: " + issue.data.html_url +
                   "\n- Requested By: @" + issue.data.user.login +
                   "\n- Created At: " + issue.data.created_at +

                   "\n\n## Deployment Status\n\n" +
                   "Released"
                });

              } catch (error) {
                console.log(error);
              }

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [
                    "released"
                  ]
                });
              } catch (error) {}

              await addComment(
                "L3 Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nL1: Approved" +
                "\nL2: Approved" +
                "\nL3: Approved" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nReleased" +
                "\n\nRelease Created" +
                "\n---------------" +
                "\nTag: " + releaseTag
              );

              return;
            }
            // ======================
            // RESUBMIT
            // ======================

            if (comment === "/resubmit") {

               if (!labels.includes("rejected")) {
                await addComment(
                  "This request is not in Rejected state."
                );
               return;
               }

               await github.rest.issues.addLabels({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 issue_number: issueNumber,
                 labels: ["pending-l1"]
               });

               try {
                 await github.rest.issues.removeLabel({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   issue_number: issueNumber,
                   name: "rejected"
                  });
                } catch (error) {}

                await addComment(
                 "Request Resubmitted.\n\nApproval cycle restarted at L1."
               );

               return;
              }

            // ======================
            // START DEPLOYMENT
            // ======================

            if (comment === "/start-deployment") {

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["deployment-running"]
              });

              await addComment(
                "Deployment started by @" + commenter
              );

             return;
             }

            // ======================
            // DEPLOYMENT FAILED
            // ======================

            if (comment === "/deployment-failed") {

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["deployment-failed"]
             });

             await addComment(
               "Deployment Failed.\n\nReported By: @" +
               commenter
             );

            return;
            }

            // ======================
            // ROLLBACK
            // ======================

            if (comment === "/rollback") {

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["rolled-back"]
             });

             await addComment(
               "Rollback completed by @" +
               commenter
             );

             return;
            }

            // ======================
            // CLOSE TICKET
            // ======================

            if (comment === "/close") {

             await github.rest.issues.update({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number:  issueNumber,
               state: "closed"
             });

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["closed"]
             });

             await addComment(
               "Ticket closed by @" + commenter
             );

             return;
            }


            // ======================
            // REJECTION FLOW
            // ======================

            if (
              comment === "/reject-l1" ||
              comment === "/reject-l2" ||
              comment === "/reject-l3"
            ) {

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["rejected"]
              });

              await addComment(
                "Request Rejected\n\nRejected By: @" +
                commenter
              );

              return;
            }
