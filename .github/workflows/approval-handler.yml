name: Approval Handler

on:
  issue_comment:
    types:
      - created

permissions:
  issues: write
  contents: write

jobs:
  process-approval:
    runs-on: ubuntu-latest

    steps:
      - name: Process Approval Commands
        uses: actions/github-script@v7
        with:
          script: |

            const issueNumber = context.issue.number;
            const comment = context.payload.comment.body.trim();
            const commenter = context.payload.comment.user.login;

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const body = issue.data.body || "";

            function extractApprover(fieldName) {
              const regex = new RegExp(
                fieldName + "\\s*\\n([^\\n]+)",
                "i"
              );

              const match = body.match(regex);

              if (!match) {
                return "";
              }

              return match[1].trim().replace("@", "");
            }

            function extractField(fieldName) {

              const regex = new RegExp(
                fieldName + "\\s*\\n([^\\n]+)",
                "i"
              );

              const match = body.match(regex);

              if (!match) {
                return "Not Provided";
              }

              return match[1].trim();
            }

            const level1Approver = extractApprover("Level-1 UX Design QA [After fixing all the UX Blockers]");
            const level2Approver = extractApprover("Level-2 Architecture [To be approved by SDE3+]");
            const level3Approver = extractApprover("Level-3 Infosec Lead");
            const level4Approver = extractApprover("Level-4 Manager");
            const level5Approver = extractApprover("Level-5 QA");
            const level6Approver = extractApprover("Level-6 DoE");


          
            const changeDescription = extractField("Change Description");
                        
            const testingDetails = extractField(
              "Areas identified for testing and Regression"
            );

          

            const testingExceptions = extractField(
              "Are we bypassing any failure from testing?"
            );

            const stageValidated = extractField(
              "Has the change been deployed and tested in STAGE environment"
            );
          
            const rollbackPlan = extractField("Rollback Plan");
            

            const changeCategory = extractField("Change Category");

            const components = extractField("Components");

            const labelsValue = extractField("Labels");

            const controlledLaunch = extractField(
              "Controlled Launch Plan"
            );

            const launchPlanDetails = extractField(
              "Launch Plan Details"
            );

            const awsConfigChanges = extractField(
              "AWS Config Changes"
            );

            const configVersion = extractField(
              "Config Version"
            );

            const implementationPlan = extractField(
              "Implementation Plan"
            );

            const qaRequired = extractField(
              "QA - Test Report?"
            );

            const emCheckedCodeDiff = extractField(
              "Has EM checked the code diff? is it part of Release note?"
            );

            const qaReviewedDesign = extractField(
              "Has QA team seen the design document and understood all the associated integrations?"
            );

            const emReviewedTestReport = extractField(
              "Has EM seen/reviewed the test report?"
            );

            const qaTestedIntegrations = extractField(
              "Has QA tested all integrations? Answer NA wherever not applicable"
            );

            const applicationName = extractField("Application Name");
            const changeType = extractField("Change Type");
            const priority = extractField("Priority");

            const plannedStart = extractField("Planned Start Time");
            const plannedEnd = extractField("Planned End Time");

            const productManager = extractField(
              "Notification to Product Manager"
            );

            const businessUser = extractField(
              "Notification to Business User"
            );

            const dependencies = extractField(
              "List of dependencies for this change to successfully work on production"
            );

            const dependentModules = extractField(
              "List of modules (services, functionalities, clients) on production that are dependent on the components being changed"
            );

            const collectionBackup = extractField(
              "Is collection backup required, for the script execution"
            );

            const servicesAtRisk = extractField(
              "List of things working on production that are at risk of breaking because of this change"
            );



            const qaReport = extractField("QA Test Report");



            const applicationConfigurations = extractField(
              "Application Configurations(Node EWS, AWS Paramstore)"
            );

            const configurationDetails = extractField(
              "Application Configurations Details"
            );

            const apigeeReference = extractField(
              "Apigee reference to onboard URL"
            );

            const testReportBreakingChanges = extractField(
              "Test Report for breaking changes ( discuss with the dependent EM, in case of any query)?"
            );

            const monitoringPlan = extractField(
              "Post Implementation Monitoring Plan"
            );
            const labelsResponse = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            const labels = labelsResponse.data.map(
              label => label.name
            );

            const cmstpTeam = extractField(
              "CMSTP for Team"
            );

            const cmstpExecutionOwner = extractField(
              "CMSTP Execution Owner"
            );

            

            const branchesImpacted = extractField(
              "No of Branches Impacted"
            );

            const efPartnersImpacted = extractField(
              "No of EF Partners Impacted"
            );

            const techProductsImpacted = extractField(
              "No of Tech Products Impacted"
            );

            const canaryDeploymentDetails = extractField(
              "Canary Deployment Details (The canary should be started with 1% traffic weight, 1 branch, partner)"
            );

            const loanProductsImpacted = extractField(
              "No of Loan Products Impacted"
            );

            const canaryDeployment = extractField(
              "Canary Deployment"
            );

            const nginxGateway = extractField(
              "Nginx API Gateway deployment required for Internal microservice?"
            );

            const nginxCallerService = extractField(
              'Specify the Caller App/Service name(s) if Nginx deployment is selected "Yes"'
            );

            async function addComment(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: message
              });
            }

            // ======================
            // L1 APPROVAL
            // ======================

            if (comment === "/approve-level1") {

              if (commenter !== level1Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level1Approver +
                  " can approve Level-1."
                );
                return;
              }

              if (!labels.includes("pending-level1")) {
                await addComment(
                  "This request is not awaiting Level-1 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level1"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level1",
                  "pending-level2"
                ]
              });

              await addComment(
                "Level-1 UX Design QA Approved by @" + commenter +

                "\nApproval Status" +
                "\n----------------" +
                "\nLevel-1 UX Design QA: Approved" +
                "\nLevel-2 Architecture: Pending" +
                "\nLevel-3 Infosec Lead: Pending" +
                "\nLevel-4 Manager: Pending" +
                "\nLevel-5 QA: Pending" +
                "\nLevel-6 DoE: Pending" +

                "\n@" + level2Approver +

                "\n/approve-level2"
              );

              return;
            }

            // ======================
            // L2 APPROVAL
            // ======================

            if (comment === "/approve-level2") {

              if (commenter !== level2Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level2Approver +
                  " can approve Level2."
                );
                return;
              }

              if (!labels.includes("pending-level2")) {
                await addComment(
                  "This request is not awaiting Level2 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level2"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level2",
                  "pending-level3"
                ]
              });

              await addComment(
                "Level-2 Architecture Approved by @" + commenter +

                "\nApproval Status" +
                "\n----------------" +
                "\nLevel-1 UX Design QA: Approved" +
                "\nLevel-2 Architecture: Approved" +
                "\nLevel-3 Infosec Lead: Pending" +
                "\nLevel-4 Manager: Pending" +
                "\nLevel-5 QA: Pending" +
                "\nLevel-6 DoE: Pending" +

                "\n@" + level3Approver +

                "\n/approve-level3"
              );

              return;
            }

              // ======================
            // L3 APPROVAL
            // ======================

            if (comment === "/approve-level3") {

              if (commenter !== level3Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level3Approver +
                  " can approve Level3."
                );
                return;
              }

              if (!labels.includes("pending-level3")) {
                await addComment(
                  "This request is not awaiting Level3 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level3"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level3",
                  "pending-level4"
                ]
              });

              await addComment(
                "Level-3 Infosec Lead Approved by @" + commenter +

                "\nApproval Status" +
                "\n----------------" +
                "\nLevel-1 UX Design QA: Approved" +
                "\nLevel-2 Architecture: Approved" +
                "\nLevel-3 Infosec Lead: Approved" +
                "\nLevel-4 Manager: Pending" +
                "\nLevel-5 QA: Pending" +
                "\nLevel-6 DoE: Pending" +

                "\n@" + level4Approver +

                "\n/approve-level4"
              );

              return;
            }

              // ======================
            // L4 APPROVAL
            // ======================

            if (comment === "/approve-level4") {

              if (commenter !== level4Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level4Approver +
                  " can approve Level4."
                );
                return;
              }

              if (!labels.includes("pending-level4")) {
                await addComment(
                  "This request is not awaiting Level4 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level4"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level4",
                  "pending-level5"
                ]
              });

              await addComment(
                "Level-4 Manager Approved by @" + commenter +

                "\nApproval Status" +
                "\n----------------" +
                "\nLevel-1 UX Design QA: Approved" +
                "\nLevel-2 Architecture: Approved" +
                "\nLevel-3 Infosec Lead: Approved" +
                "\nLevel-4 Manager: Approved" +
                "\nLevel-5 QA: Pending" +
                "\nLevel-6 DoE: Pending" +

                "\n@" + level5Approver +

                "\n/approve-level5"
              );

              return;
            }

              // ======================
            // L5 APPROVAL
            // ======================

            if (comment === "/approve-level5") {

              if (commenter !== level5Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level5Approver +
                  " can approve Level5."
                );
                return;
              }

              if (!labels.includes("pending-level5")) {
                await addComment(
                  "This request is not awaiting Level5 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level5"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level5",
                  "pending-level6"
                ]
              });

              await addComment(
                "Level-5 QA Approved by @" + commenter +

                "\nApproval Status" +
                "\n----------------" +
                "\nLevel-1 UX Design QA: Approved" +
                "\nLevel-2 Architecture: Approved" +
                "\nLevel-3 Infosec Lead: Approved" +
                "\nLevel-4 Manager: Approved" +
                "\nLevel-5 QA: Approved" +
                "\nLevel-6 DoE: Pending" +

                "\n@" + level6Approver +

                "\n/approve-level6"
              );

              return;
            }

            // ======================
            // L6 APPROVAL
            // ======================

            if (comment === "/approve-level6") {

              if (commenter !== level6Approver) {
                await addComment(
                  "Unauthorized.\n\nOnly @" +
                  level6Approver +
                  " can approve Level6."
                );
                return;
              }

              if (!labels.includes("pending-level6")) {
                await addComment(
                  "This request is not awaiting Level6 approval."
                );
                return;
              }

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name: "pending-level6"
                });
              } catch (error) {}

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: [
                  "approved-level6",
                  "deployment-running"
                ]
              });
              const compareFrom = extractField("Compare From");
              const compareTo = extractField("Compare To");
              const diffUrl =
                `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${compareFrom}...${compareTo}`;
              const releaseTag =
                "deployment-request-" + issueNumber;

              try {

               const repoInfo = await github.rest.repos.get({
                 owner: context.repo.owner,
                 repo: context.repo.repo
               });

               const commits = await github.rest.repos.listCommits({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 per_page: 5
               });

               const latestCommit = commits.data[0];

               const recentCommits = commits.data
                 .map(commit =>
                   "- " +
                   commit.sha.substring(0, 7) +
                   " | " +
                   commit.commit.author.name +
                   " | " +
                   commit.commit.message
                  )
                 .join("\n");

               const changedFiles = await github.rest.repos.getCommit({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 ref: latestCommit.sha
                });

               const fileList = changedFiles.data.files
                 ?.map(file => "- " + file.filename)
                 .join("\n") || "Not Available";

                await github.rest.repos.createRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,

                  tag_name: releaseTag,

                  name:
                    "Deployment Request #" +
                    issueNumber,

                  body:
                    "# DEPLOYMENT RECORD\n\n" +

                   "## Change Information\n\n" +

                   "- Issue Number: #" + issueNumber +
                   "\n- Application Name: " + applicationName +
                   "\n- Change Category: " + changeCategory +
                   "\n- Components: " + components +
                   "\n- Labels: " + labelsValue +
                   "\n- Change Type: " + changeType +
                   "\n- Priority: " + priority +
                   "\n- Planned Start: " + plannedStart +
                   "\n- Planned End: " + plannedEnd +
                   "\n- CMSTP Team: " + cmstpTeam +
                   "\n- CMSTP Execution Owner: " + cmstpExecutionOwner +
                   


                   "\n\n## Change Description\n\n" +
                   changeDescription +



                   "\n\n## Stakeholders\n\n" +
                   "- Product Manager: " + productManager +
                   "\n- Business User: " + businessUser +

                   "\n\n## Testing Details\n\n" +
                   testingDetails +

                   "\n\n## Testing & QA Validation\n\n" +
                   "- QA Test Report Required: " + qaRequired +
                   "\n- QA Report: " + qaReport +
                   "\n- Testing Details: " + testingDetails +
                   "\n- Testing Exceptions: " + testingExceptions +
                   "\n- Stage Validated: " + stageValidated +
                   "\n- EM Checked Code Diff: " + emCheckedCodeDiff +
                   "\n- QA Reviewed Design: " + qaReviewedDesign +
                   "\n- EM Reviewed Test Report: " + emReviewedTestReport +
                   "\n- QA Tested Integrations: " + qaTestedIntegrations +

                   "\n\n## Controlled Launch Plan\n\n" +
                   "- Controlled Launch: " + controlledLaunch +
                   "\n\nLaunch Plan Details:\n" +
                   launchPlanDetails +

                   "\n\n## Impact Assessment\n\n" +
                   "- Dependencies: " + dependencies +
                   "\n- Dependent Modules: " + dependentModules +
                   "\n- Collection Backup Required: " + collectionBackup +
                   "\n- Services At Risk: " + servicesAtRisk +
                   "\n- Branches Impacted: " + branchesImpacted +
                   "\n- EF Partners Impacted: " + efPartnersImpacted +
                   "\n- Tech Products Impacted: " + techProductsImpacted +
                   "\n- Loan Products Impacted: " + loanProductsImpacted +

                   "\n\n## Deployment Controls\n\n" +
                   "- Canary Deployment: " + canaryDeployment +
                   "\n\nCanary Deployment Details:\n" +
                   canaryDeploymentDetails +
                   "\n- Test Report For Breaking Changes: " +
                   testReportBreakingChanges +
                   "\n- Nginx Gateway Required: " +
                   nginxGateway +
                   "\n- Caller Service: " +
                   nginxCallerService +

                   "\n\n## Rollback Plan\n\n" +
                   rollbackPlan +

                   "\n\n## Configuration Changes\n\n" +
                   "- AWS Config Changes: " + awsConfigChanges +
                   "\n- Config Version: " + configVersion +
                   "\n- Application Configurations: " +
                   applicationConfigurations +
                   "\n- Apigee Reference URL: " +
                   apigeeReference +

                   "\n\nConfiguration Details:\n" +
                   configurationDetails +

                   "\n\n## Implementation Plan\n\n" +
                   implementationPlan +

                   "\n\n## Monitoring Plan\n\n" +
                   monitoringPlan +

                   

                   "\n\n## Approval Information\n\n" +
                   "- Level-1 UX Design QA: " + level1Approver +
                   "\n- Level-2 Architecture: " + level2Approver +
                   "\n- Level-3 Infosec Lead: " + level3Approver +
                   "\n- Level-4 Manager: " + level4Approver +
                   "\n- Level-5 QA: " + level5Approver +
                   "\n- Level-6 DoE: " + level6Approver +
                   
                   "\n\n## Approval Chain\n\n" +
                   "- Level-1 UX Design QA: Approved" +
                   "\n- Level-2 Architecture: Approved" +
                   "\n- Level-3 Infosec Lead: Approved" +
                   "\n- Level-4 Manager: Approved" +
                   "\n- Level-5 QA: Approved" +
                   "\n- Level-6 DoE: Approved" +

                   "\n\n## Repository Information\n\n" +
                   "- Repository: " + context.repo.repo +
                   "\n- Owner: " + context.repo.owner +
                   "\n- Branch: " + repoInfo.data.default_branch +
                   "\n- Repository URL: " + repoInfo.data.html_url +

                   "\n\n## Latest Commit\n\n" +
                   "- SHA: " + latestCommit.sha +
                   "\n- Author: " + latestCommit.commit.author.name +
                   "\n- Date: " + latestCommit.commit.author.date +
                   "\n- Message: " + latestCommit.commit.message +

                   "\n\n## Files Changed In Latest Commit\n\n" +
                   fileList +

                   "\n\n## Recent Commit History\n\n" +
                   recentCommits +

                   "\n\n## Workflow Information\n\n" +
                   "- Run Number: " + process.env.GITHUB_RUN_NUMBER +
                   "\n- Actor: " + commenter +

                   "\n\n## Audit Information\n\n" +
                   "- Issue URL: " + issue.data.html_url +
                   "\n- Requested By: @" + issue.data.user.login +
                   "\n- Created At: " + issue.data.created_at +

                   "\n\n## Source Control Information\n\n" +
                   "- Compare From: " + compareFrom +
                   "\n- Compare To: " + compareTo +
                   "\n- Git Diff URL: " + diffUrl +

                   "\n\n## Deployment Status\n\n" +
                   "Released"
                });

              } catch (error) {
                console.log(error);
              }

              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: [
                    "released"
                  ]
                });
              } catch (error) {}

              await addComment(
                "Level-6 DoE Approved by @" + commenter +
                "\n\nApproval Status" +
                "\n----------------" +
                "\nLevel-1: Approved" +
                "\nLevel-2: Approved" +
                "\nLevel-3: Approved" +
                "\nLevel-4: Approved" +
                "\nLevel-5: Approved" +
                "\nLevel-6: Approved" +
                "\n\nCurrent Stage" +
                "\n--------------" +
                "\nReleased" +
                "\n\nRelease Created" +
                "\n---------------" +
                "\nTag: " + releaseTag
              );

              return;
            }
            // ======================
            // RESUBMIT
            // ======================

            if (comment === "/resubmit") {

               if (!labels.includes("rejected")) {
                await addComment(
                  "This request is not in Rejected state."
                );
               return;
               }

               await github.rest.issues.addLabels({
                 owner: context.repo.owner,
                 repo: context.repo.repo,
                 issue_number: issueNumber,
                 labels: ["pending-level1"]
               });

               try {
                 await github.rest.issues.removeLabel({
                   owner: context.repo.owner,
                   repo: context.repo.repo,
                   issue_number: issueNumber,
                   name: "rejected"
                  });
                } catch (error) {}

                await addComment(
                 "Request Resubmitted.\n\nApproval cycle restarted at Level1."
               );

               return;
              }

            // ======================
            // START DEPLOYMENT
            // ======================

            if (comment === "/start-deployment") {

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["deployment-running"]
              });

              await addComment(
                "Deployment started by @" + commenter
              );

             return;
             }

            // ======================
            // DEPLOYMENT FAILED
            // ======================

            if (comment === "/deployment-failed") {

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["deployment-failed"]
             });

             await addComment(
               "Deployment Failed.\n\nReported By: @" +
               commenter
             );

            return;
            }

            // ======================
            // ROLLBACK
            // ======================

            if (comment === "/rollback") {

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["rolled-back"]
             });

             await addComment(
               "Rollback completed by @" +
               commenter
             );

             return;
            }

            // ======================
            // CLOSE TICKET
            // ======================

            if (comment === "/close") {

             await github.rest.issues.update({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number:  issueNumber,
               state: "closed"
             });

             await github.rest.issues.addLabels({
               owner: context.repo.owner,
               repo: context.repo.repo,
               issue_number: issueNumber,
               labels: ["closed"]
             });

             await addComment(
               "Ticket closed by @" + commenter
             );

             return;
            }


            // ======================
            // REJECTION FLOW
            // ======================

            if (
              comment === "/reject-level1" ||
              comment === "/reject-level2" ||
              comment === "/reject-level3" ||
              comment === "/reject-level4" ||
              comment === "/reject-level5" ||
              comment === "/reject-level6"
            ) {

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                labels: ["rejected"]
              });

              await addComment(
                "Request Rejected\n\nRejected By: @" +
                commenter
              );

              return;
            }
