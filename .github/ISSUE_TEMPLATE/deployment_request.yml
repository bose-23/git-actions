name: Deployment Request
description: Submit a deployment/change request
title: "[DEPLOYMENT] "
labels:
  - new-request

body:

  - type: markdown
    attributes:
      value: |
        ## Change Information

  - type: input
    id: application_name
    attributes:
      label: Application Name
      placeholder: KYC Service
    validations:
      required: true

  - type: dropdown
    id: change_category
    attributes:
      label: Change Category
      options:
        - Standard
        - Normal
        - Emergency
    validations:
      required: true

  - type: dropdown
    id: change_type
    attributes:
      label: Change Type
      options:
        - Enhancement
        - Bug Fix
        - Configuration Change
        - Emergency Change
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Target Environment
      options:
        - DEV
        - UAT
        - PREPROD
        - PROD
    validations:
      required: true

  - type: dropdown
    id: risk_level
    attributes:
      label: Risk Level
      options:
        - Low
        - Medium
        - High
    validations:
      required: true

  - type: textarea
    id: change_description
    attributes:
      label: Change Description
      description: Describe the proposed change
    validations:
      required: true

  - type: textarea
    id: business_justification
    attributes:
      label: Business Justification
      description: Why is this change required?
    validations:
      required: true

  - type: input
    id: components
    attributes:
      label: Components
      placeholder: KYC, Payments, Notification

  - type: input
    id: labels_value
    attributes:
      label: Labels
      placeholder: deployment, release, production

  - type: markdown
    attributes:
      value: |
        ## Schedule

  - type: input
    id: planned_start
    attributes:
      label: Planned Start Time
      placeholder: 26-Aug-2026 10:00 PM IST
    validations:
      required: true

  - type: input
    id: planned_end
    attributes:
      label: Planned End Time
      placeholder: 26-Aug-2026 11:00 PM IST
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Stakeholders & Notifications

  - type: input
    id: product_manager
    attributes:
      label: Notification to Product Manager
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: business_user
    attributes:
      label: Notification to Business User
      placeholder: GitHub Username
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Source Control Information

  - type: input
    id: compare_from
    attributes:
      label: Compare From
      description: Previous Release Tag / Branch / Commit
      placeholder: v1.2.3
    validations:
      required: true

  - type: input
    id: compare_to
    attributes:
      label: Compare To
      description: New Release Tag / Branch / Commit
      placeholder: v1.2.4
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Impact Assessment

  - type: textarea
    id: impacted_components
    attributes:
      label: Impacted Components
      description: Applications, APIs, Services or Modules affected
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Dependencies required for deployment
    validations:
      required: true

  - type: textarea
    id: dependent_modules
    attributes:
      label: Dependent Modules
      description: Downstream systems impacted
    validations:
      required: true

  - type: textarea
    id: services_at_risk
    attributes:
      label: Services At Risk
      description: Services that may be impacted
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Testing & QA Validation

  - type: dropdown
    id: qa_test_report_required
    attributes:
      label: QA - Test Report?
      options:
        - Yes
        - Not Required
    validations:
      required: true

  - type: input
    id: qa_test_report
    attributes:
      label: QA Test Report Link
      placeholder: URL to QA report

  - type: dropdown
    id: em_checked_code_diff
    attributes:
      label: Has EM checked the code diff? Is it part of release notes?
      options:
        - Yes
        - No
        - NA
    validations:
      required: true

  - type: dropdown
    id: qa_reviewed_design
    attributes:
      label: Has QA team reviewed design documentation and integrations?
      options:
        - Yes
        - No
        - NA
    validations:
      required: true

  - type: dropdown
    id: em_reviewed_test_report
    attributes:
      label: Has EM reviewed the test report?
      options:
        - Yes
        - No
        - NA
    validations:
      required: true

  - type: dropdown
    id: qa_tested_integrations
    attributes:
      label: Has QA tested all integrations?
      options:
        - Yes
        - No
        - NA
    validations:
      required: true

  - type: textarea
    id: testing_details
    attributes:
      label: Testing Details
      description: Summary of testing performed
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Controlled Launch Plan

  - type: dropdown
    id: controlled_launch
    attributes:
      label: Controlled Launch Plan
      options:
        - Yes
        - No
    validations:
      required: true

  - type: textarea
    id: launch_plan_details
    attributes:
      label: Launch Plan Details
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Configuration Changes

  - type: dropdown
    id: aws_config_change
    attributes:
      label: AWS Config Changes
      options:
        - Yes
        - No
    validations:
      required: true

  - type: input
    id: config_version
    attributes:
      label: Config Version
      placeholder: v1.0
    validations:
      required: true

  - type: textarea
    id: configuration_details
    attributes:
      label: Configuration Details
      description: Secrets, Parameter Store, ENV variables, etc.

  - type: markdown
    attributes:
      value: |
        ## Deployment Execution

  - type: textarea
    id: implementation_plan
    attributes:
      label: Implementation Plan
    validations:
      required: true

  - type: textarea
    id: monitoring_plan
    attributes:
      label: Post Implementation Monitoring Plan
    validations:
      required: true

  - type: textarea
    id: rollback_plan
    attributes:
      label: Rollback Plan
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Approval Chain

  - type: input
    id: level1_ux_qa
    attributes:
      label: Level-1 UX Design QA
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: level2_architecture
    attributes:
      label: Level-2 Architecture
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: level3_infosec
    attributes:
      label: Level-3 Infosec Lead
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: level4_manager
    attributes:
      label: Level-4 Manager
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: level5_qa
    attributes:
      label: Level-5 QA
      placeholder: GitHub Username
    validations:
      required: true

  - type: input
    id: level6_doe
    attributes:
      label: Level-6 DoE (Director of Engineering)
      placeholder: GitHub Username
    validations:
      required: true
